<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AARAMBH Follow-up Navigator</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{font-family:'DM Sans',sans-serif;color:#193b42;background:#f5f8fa;-webkit-font-smoothing:antialiased;--teal:#168c88;--dark:#123b46;--muted:#6d8187;--border:#e3ebed;--shadow:0 18px 50px rgba(25,72,79,.09)}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;min-width:320px;min-height:100vh;background:#f5f8fa}
body,button,input,select,textarea{font-family:'DM Sans',sans-serif}
button{cursor:pointer}
a{color:inherit;text-decoration:none}
[hidden]{display:none!important}
button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid #168c8855;outline-offset:3px}
.site{width:100%;overflow-x:clip}
h1,h2,h3{font-family:Manrope,sans-serif;color:var(--dark)}
.announcement{min-height:38px;display:flex;align-items:center;justify-content:center;gap:9px;padding:8px 18px;background:#e6f5f2;color:#245f60;text-align:center;font-size:12px;font-weight:600}
.announcement-pill{background:#fff;color:var(--teal);border:1px solid #d0eae5;border-radius:30px;padding:3px 9px;font-size:10px;font-weight:800}
.site-header{min-height:78px;padding:14px 5%;display:flex;align-items:center;justify-content:space-between;gap:18px;background:#fffffff2;border-bottom:1px solid #eaf0f1;position:sticky;top:0;z-index:20;backdrop-filter:blur(15px)}
.brand{display:inline-flex;align-items:center;gap:11px;flex-shrink:0}
.brand-mark{width:43px;height:43px;display:grid;place-items:center;border-radius:14px;background:linear-gradient(145deg,#168c88,#0e6769);color:#fff;font-size:21px;font-weight:800;box-shadow:0 6px 15px #168c8838}
.brand strong{display:block;font-family:Manrope,sans-serif;font-size:20px;font-weight:800;letter-spacing:1.4px;color:var(--dark)}
.brand small{display:block;margin-top:1px;color:#829297;font-size:10px}
.desktop-nav{display:flex;align-items:center;gap:22px}
.desktop-nav a{color:#60767c;font-size:13px;font-weight:600;padding:6px 0;border-bottom:2px solid transparent}
.desktop-nav a:hover,.desktop-nav a.active{color:var(--teal);border-color:var(--teal)}
.header-actions{display:flex;align-items:center;gap:10px}
.lang{border:1px solid #e1e9eb;background:#fff;color:#476168;border-radius:10px;padding:10px 12px;font-size:12px;font-weight:700}
.menu-btn{display:none;width:42px;height:42px;border:1px solid #dbe6e8;border-radius:11px;background:#fff;font-size:20px}
.mobile-nav{display:flex;flex-direction:column;gap:4px;padding:12px 5% 18px;background:#fff;border-bottom:1px solid #eaf0f1;position:sticky;top:70px;z-index:19}
.mobile-nav a{padding:12px;border-radius:10px;font-weight:600;font-size:14px;color:#35575e}
.mobile-nav a:hover{background:#eef7f6}
.btn{display:inline-flex;justify-content:center;align-items:center;gap:8px;min-height:43px;padding:11px 19px;border:1px solid transparent;border-radius:11px;font-size:13px;font-weight:700;text-align:center;transition:transform .2s,background .2s}
.btn:hover{transform:translateY(-2px)}
.btn-outline{background:#fff;color:#24525a;border-color:#dbe6e8}
.btn-outline:hover{border-color:var(--teal);background:#f4fbfa}
.btn-primary{background:var(--teal);color:#fff;box-shadow:0 6px 15px #168c882e}
.btn-primary:hover{background:#117571}
.btn-dark{background:var(--dark);color:#fff}
.btn-danger{background:#c14e35;color:#fff}
.btn-white{background:#fff;color:#145c5c}
.btn-outline-white{border-color:#ffffff66;background:transparent;color:#fff}
.btn-large{min-height:51px;padding:14px 22px;font-size:14px;border-radius:13px}
.btn-sm{min-height:34px;padding:7px 12px;font-size:12px;border-radius:9px}
.hero{max-width:1440px;margin:auto;padding:60px 5% 40px;display:grid;grid-template-columns:.95fr 1.05fr;align-items:center;gap:50px}
.eyebrow{display:inline-flex;align-items:center;gap:8px;margin:0 0 18px;padding:8px 13px;border:1px solid #d9ece8;border-radius:30px;background:#eaf6f3;color:#197f7b;font-size:11px;font-weight:800;letter-spacing:.7px}
.hero h1{margin:0;max-width:630px;font-size:clamp(36px,4.2vw,58px);line-height:1.13;letter-spacing:-2px;font-weight:800}
.hero h1 span{color:var(--teal)}
.hero-description{max-width:520px;margin:22px 0 26px;color:#687e84;font-size:15px;line-height:1.9}
.hero-actions{display:flex;flex-wrap:wrap;gap:12px}
.hero-points{display:flex;flex-wrap:wrap;gap:10px 17px;margin-top:25px}
.hero-points>div{display:flex;align-items:center;gap:7px;color:#577279;font-size:12px;font-weight:600}
.hero-points>div::before{content:'✓';width:19px;height:19px;display:grid;place-items:center;border-radius:50%;background:#dff3ec;color:var(--teal);font-weight:800}
.hero-visual{position:relative;padding:0 0 28px 12px;min-width:0}
.photo-frame{position:relative;overflow:hidden;width:100%;aspect-ratio:1.08/1;border:7px solid #fff;border-radius:28px;box-shadow:var(--shadow)}
.photo-frame img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.deco{position:absolute;border-radius:50%;background:#ffffff1c}
.d1{width:240px;height:240px;right:-60px;top:-60px}
.d2{width:160px;height:160px;left:-40px;bottom:60px}
.slide-ico{position:absolute;left:50%;top:40%;transform:translate(-50%,-50%);width:150px;height:150px;border-radius:50%;background:#ffffffee;display:grid;place-items:center;font-size:74px;box-shadow:0 14px 40px #0003;animation:fade .6s ease}
.photo-wash{position:absolute;inset:45% 0 0;background:linear-gradient(transparent,#0d2a46cc)}
.photo-label{position:absolute;left:20px;top:20px;padding:8px 13px;border-radius:30px;background:#fffffff0;color:#197d78;font-size:10px;font-weight:800}
.photo-caption{position:absolute;bottom:22px;left:24px;right:24px;display:flex;align-items:flex-end;justify-content:space-between;gap:15px;color:#fff}
.photo-caption h3{margin:0 0 5px;color:#fff;font-size:clamp(18px,2vw,25px)}
.photo-caption p{margin:0;color:#e6f1f0;font-size:12px;line-height:1.6}
.caption-number{font-size:12px;font-weight:700;white-space:nowrap}
@keyframes fade{from{opacity:.5;transform:translate(-50%,-50%) scale(.94)}to{opacity:1;transform:translate(-50%,-50%) scale(1)}}
.slide-controls{display:flex;justify-content:center;align-items:center;gap:8px;margin-top:15px}
.slide-controls button{width:9px;height:9px;padding:0;border:0;border-radius:30px;background:#cbd9db}
.slide-controls button.selected{width:26px;background:var(--teal)}
.journey-chips{display:flex;flex-wrap:wrap;justify-content:center;gap:6px;margin-top:12px}
.journey-chips span{padding:5px 9px;border-radius:30px;background:#eaf0f1;color:#7b8d92;font-size:10px;font-weight:700}
.journey-chips span.on{background:var(--teal);color:#fff}
.strip{max-width:1200px;margin:auto;padding:0 5% 50px;display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.strip-item{display:flex;align-items:center;gap:10px;padding:14px;border:1px solid #e5edef;border-radius:13px;background:#fff}
.strip-item i{font-style:normal;width:36px;height:36px;display:grid;place-items:center;border-radius:10px;background:#e7f5f2;font-size:18px;flex-shrink:0}
.strip-item strong{display:block;color:#31545b;font-size:12px}
.strip-item small{display:block;margin-top:3px;color:#8a9a9e;font-size:10px}
.section{padding:60px 5%}
.section-heading{max-width:680px;margin:0 auto 34px;text-align:center}
.section-heading h2{margin:0;font-size:clamp(26px,3vw,38px);letter-spacing:-1.1px;line-height:1.25}
.section-heading p{margin:14px auto 0;max-width:570px;color:#73868b;font-size:14px;line-height:1.8}
.portals{background:#fff}
.portal-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:22px;max-width:1060px;margin:auto}
.portal-card{padding:30px;border:1px solid #e3ecee;border-radius:22px;background:#fbfdfd;transition:transform .25s,box-shadow .25s}
.portal-card:hover{transform:translateY(-4px);box-shadow:var(--shadow)}
.portal-kicker{display:inline-block;margin-bottom:16px;padding:7px 11px;border-radius:30px;background:#e4f4ef;color:var(--teal);font-size:10px;font-weight:800;letter-spacing:.7px}
.portal-card.patient .portal-kicker{background:#e5f3fa;color:#347ba0}
.portal-card h3{margin:0 0 10px;font-size:24px}
.portal-card>p{margin:0 0 20px;color:#75878c;font-size:13px;line-height:1.85}
.portal-card ul{display:grid;gap:10px;padding:0;margin:0 0 24px;list-style:none}
.portal-card li{display:flex;gap:9px;color:#506b71;font-size:12.5px;line-height:1.6}
.portal-card li::before{content:'✓';color:var(--teal);font-weight:800}
.portal-card>.btn{width:100%}
.support-band{margin:0 5% 60px;padding:40px 44px;display:flex;align-items:center;justify-content:space-between;gap:25px;border-radius:24px;background:linear-gradient(120deg,#123b46,#176b6a);color:#fff}
.support-band h2{max-width:550px;margin:0 0 12px;color:#fff;font-size:clamp(22px,3vw,32px);line-height:1.3}
.support-band p{max-width:560px;margin:0;color:#d2e6e4;font-size:13px;line-height:1.8}
.support-actions{display:flex;flex-wrap:wrap;gap:10px}
.footer{padding:34px 5%;display:flex;align-items:center;justify-content:space-between;gap:25px;background:#fff;border-top:1px solid #e5edef;flex-wrap:wrap}
.footer p{margin:8px 0 0;color:#809095;font-size:11px;line-height:1.8}
.footer-links{display:flex;flex-wrap:wrap;gap:18px;align-items:center;color:#60777c;font-size:12px;font-weight:600}
.footer-links button{border:0;background:none;color:#9a5b4a;font-size:12px;font-weight:600;padding:0}
.page{max-width:1100px;margin:auto;padding:44px 5% 70px}
.page h1{margin:0 0 8px;font-size:clamp(26px,3.4vw,38px);letter-spacing:-1px}
.page .lead{color:#6d8187;font-size:14px;line-height:1.8;max-width:720px;margin:0 0 28px}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(2,1fr)}.g3{grid-template-columns:repeat(3,1fr)}.g4{grid-template-columns:repeat(4,1fr)}
.card{padding:22px;border:1px solid #e1ebec;border-radius:17px;background:#fff}
.card h3{margin:0 0 8px;font-size:16px}
.card p,.card li{color:#6d8187;font-size:13px;line-height:1.75;margin:0}
.card ul{margin:0;padding-left:18px}
.card .num{width:38px;height:38px;display:grid;place-items:center;margin-bottom:14px;border-radius:12px;background:#e5f4f0;color:var(--teal);font-weight:800;font-size:13px}
.insight{margin-top:24px;padding:16px 22px;border-radius:14px;background:#123b46;color:#fff;font-weight:600;font-size:14px;line-height:1.7}
.bar-row{display:grid;grid-template-columns:190px 1fr 52px;gap:12px;align-items:center;margin:10px 0;font-size:12px;color:#48656b}
.bar{height:12px;border-radius:30px;background:#e8f0f1;overflow:hidden}.bar i{display:block;height:100%;background:var(--teal);border-radius:30px}
.big-stat{font-family:Manrope,sans-serif;font-size:42px;font-weight:800;color:var(--teal);line-height:1}
.safe-note,.warn-note{margin-top:18px;padding:14px 18px;border-radius:13px;font-size:12.5px;line-height:1.75}
.safe-note{background:#e7f4f0;border:1px solid #dcece8;color:#3f6667}
.warn-note{background:#fff8e8;border:1px solid #f0dfb6;color:#806c4d}
.tl{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
.tl .card b{display:inline-block;margin-bottom:10px;padding:5px 10px;border-radius:30px;background:#eaf6f3;color:var(--teal);font-size:11px}
.auth-page{min-height:70vh;display:grid;place-items:center;padding:40px 5%}
.auth-card{width:100%;max-width:470px;padding:32px;border:1px solid #e6efef;border-radius:24px;background:#fff;box-shadow:var(--shadow)}
.auth-eyebrow{display:inline-block;margin:0 0 10px;color:var(--teal);font-size:10px;font-weight:800;letter-spacing:1px}
.auth-card h1{margin:0 0 10px;font-size:27px;letter-spacing:-.7px}
.auth-intro{margin:0 0 22px;color:#788b8f;font-size:12.5px;line-height:1.8}
.field{display:flex;flex-direction:column;gap:7px;margin-bottom:16px;color:#36575e;font-size:12px;font-weight:700}
.field input,.field select,.field textarea,.filters input,.filters select{width:100%;min-height:43px;padding:11px 12px;border:1px solid #dce7e9;border-radius:10px;background:#fbfdfd;color:#21454d;font-size:13px;font-weight:400}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--teal);outline:none;box-shadow:0 0 0 3px #168c881a}
.check{display:flex;gap:10px;align-items:flex-start;margin:0 0 10px;padding:11px 12px;border:1px solid #e1ebec;border-radius:10px;font-size:13px;color:#3c5a61;font-weight:500}
.check input{margin-top:3px;width:auto}
.demo-box{margin-top:18px;padding:12px;border:1px dashed #e4d7bd;border-radius:10px;background:#fffaf0;color:#806c4d;font-size:11px;line-height:1.9}
.dash{min-height:80vh;padding:32px 5% 60px;background:#f3f7f8}
.dash-top{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:16px;margin-bottom:26px}
.dash-top h1{margin:0 0 6px;font-size:clamp(24px,3vw,33px)}
.dash-top p{margin:0;color:#7b8d92;font-size:12.5px;line-height:1.7}
.actions{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.demo-tag{display:inline-flex;padding:7px 12px;border:1px solid #f0dfb6;border-radius:30px;background:#fff8e8;color:#98733a;font-size:10px;font-weight:800}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:22px}
.stat-card{padding:19px;border:1px solid #e4ecee;border-radius:16px;background:#fff}
.stat-card span,.stat-card small{display:block}
.stat-card span{color:#7c8e92;font-size:11px}
.stat-card strong{display:block;margin:9px 0 4px;color:#163f48;font-family:Manrope,sans-serif;font-size:28px}
.stat-card small{color:var(--teal);font-size:10px}
.case-card{overflow:hidden;margin-bottom:22px;border:1px solid #e2eaec;border-radius:17px;background:#fff}
.case-head{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:12px;padding:18px 20px;border-bottom:1px solid #eaf0f1}
.case-head h3{margin:0;font-size:15px}
.filters{display:flex;gap:9px;flex-wrap:wrap}.filters input{min-width:200px}.filters select{width:auto}
.table-wrap{width:100%;overflow-x:auto}
table{width:100%;border-collapse:collapse;white-space:nowrap}
th{padding:13px 16px;background:#f8fbfb;color:#7b8d92;font-size:10px;font-weight:800;text-align:left;text-transform:uppercase;letter-spacing:.4px}
td{padding:14px 16px;border-top:1px solid #edf1f2;color:#48656b;font-size:12.5px;vertical-align:middle}
.sub{display:block;margin-top:3px;color:#839398;font-size:10.5px}
.status,.risk{display:inline-flex;align-items:center;padding:6px 10px;border-radius:30px;font-size:10px;font-weight:800;white-space:nowrap}
.status{background:#e7f5ed;color:#317b59}
.status.Overdue{background:#fff0ec;color:#c14e35}.status.Duetoday{background:#fff6e3;color:#9b7022}.status.Completed,.status.Closed{background:#edf1f2;color:#6d8187}
.risk.high{background:#fff0ec;color:#c14e35}.risk.medium{background:#fff6e3;color:#9b7022}.risk.low{background:#e8f5ee;color:#34785a}
.empty-state{padding:26px;text-align:center;color:#7b8d92;font-size:13px}
.two{display:grid;grid-template-columns:1.25fr 1fr;gap:20px;align-items:start}
.kv{display:grid;grid-template-columns:140px 1fr;gap:8px 14px;font-size:13px;color:#48656b}.kv b{color:#7b8d92;font-weight:600}
.journey{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;margin:14px 0}
.j{text-align:center;font-size:10px;color:#9aa9ad;font-weight:600}
.j b{display:grid;place-items:center;width:30px;height:30px;margin:0 auto 6px;border-radius:50%;background:#e8eef0;color:#7b8d92}
.j.on{color:#21464d}.j.on b{background:var(--teal);color:#fff}
.log{border-left:2px solid #dbe8e8;margin:0 0 16px 6px;padding-left:16px}
.log div{margin-bottom:12px;font-size:12.5px;color:#48656b}.log small{display:block;color:#8a9a9e;font-size:10.5px}
.reason{margin:0 0 8px;padding:10px 12px;border-radius:10px;background:#fff6f3;color:#8a4a39;font-size:12.5px}
.action-i{margin:0 0 8px;padding:10px 12px;border-radius:10px;background:#eef8f5;color:#2c6a60;font-size:12.5px}
.pill-row{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.pill{padding:6px 10px;border-radius:30px;background:#eef3f4;color:#55707a;font-size:11px;font-weight:700}
.fu-card{display:block;padding:20px;border:1px solid #e1ebec;border-radius:17px;background:#fff;transition:transform .2s,box-shadow .2s}
.fu-card:hover{transform:translateY(-3px);box-shadow:var(--shadow)}
.fu-card h3{margin:0 0 6px;font-size:16px}
.due-pill{display:inline-block;margin-bottom:12px;padding:6px 11px;border-radius:30px;font-size:11px;font-weight:800;background:#e7f5ed;color:#317b59}
.due-pill.late{background:#fff0ec;color:#c14e35}.due-pill.today{background:#fff6e3;color:#9b7022}.due-pill.done{background:#edf1f2;color:#6d8187}
.alert{margin-bottom:18px;padding:14px 18px;border-radius:13px;background:#fff0ec;border:1px solid #f5d5cb;color:#9c3f2a;font-size:13px;font-weight:600}
.map{width:100%;height:340px;border:0;border-radius:14px;background:#e8eef0}
.ride{display:grid;grid-template-columns:44px 1.3fr 1fr auto;gap:14px;align-items:center;padding:14px 0;border-top:1px solid #edf1f2}
.ride:first-child{border-top:0}.ride i{font-style:normal;font-size:28px}.ride b{display:block;font-size:13px;color:#21464d}.ride small{color:#8a9a9e;font-size:11px;line-height:1.5}
.fare{font-family:Manrope,sans-serif;font-weight:800;color:var(--dark);font-size:15px}
.toast{position:fixed;left:50%;bottom:26px;transform:translate(-50%,30px);opacity:0;pointer-events:none;z-index:200;max-width:92vw;padding:13px 20px;border-radius:13px;background:#123b46;color:#fff;font-size:13px;box-shadow:0 12px 40px #0004;transition:.3s}
.toast.show{opacity:1;transform:translate(-50%,0)}
.chat-launcher{position:fixed;right:22px;bottom:22px;z-index:70;padding:14px 18px;border:0;border-radius:30px;background:var(--teal);color:#fff;box-shadow:0 9px 30px #168c8844;font-weight:700}
.chat-panel{position:fixed;right:22px;bottom:22px;z-index:80;width:min(390px,calc(100vw - 28px));height:min(520px,calc(100vh - 45px));display:flex;flex-direction:column;overflow:hidden;border:1px solid #dce8e8;border-radius:20px;background:#fff;box-shadow:0 20px 70px #123b4633}
.chat-head{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:16px 18px;background:var(--dark);color:#fff}
.chat-head strong,.chat-head small{display:block}.chat-head small{margin-top:4px;color:#d2e6e4;font-size:10px}
.modal-close{width:34px;height:34px;border:1px solid #ffffff40;border-radius:10px;background:#ffffff18;color:#fff;font-size:20px}
.chat-body{flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:12px;padding:16px;background:#f5f9f9}
.chat-bubble{align-self:flex-start;max-width:92%;padding:11px 13px;border:1px solid #e0ebeb;border-radius:13px 13px 13px 3px;background:#fff;color:#476168;font-size:12.5px;line-height:1.7;white-space:pre-wrap}
.chat-user{align-self:flex-end;border-radius:13px 13px 3px 13px;background:#e8f6f1;color:#245b58}
.chat-compose{display:flex;gap:8px;padding:12px;border-top:1px solid #e7eeee}
.chat-compose input{min-width:0;flex:1;border:1px solid #dce7e9;border-radius:10px;padding:10px;font-size:12.5px}
@media(max-width:1100px){.desktop-nav{gap:14px}.desktop-nav a{font-size:12px}.hero{gap:30px}.g4,.tl,.stats{grid-template-columns:repeat(2,1fr)}}
@media(max-width:900px){.desktop-nav,.header-actions .btn{display:none}.menu-btn{display:block}.hero{grid-template-columns:1fr;padding-top:40px}.portal-grid,.g2,.g3,.two{grid-template-columns:1fr}.strip{grid-template-columns:1fr 1fr}.support-band{flex-direction:column;align-items:flex-start;padding:28px 22px}.ride{grid-template-columns:40px 1fr}.ride>*:nth-child(n+3){grid-column:2}.bar-row{grid-template-columns:110px 1fr 44px}}

const DAY=86400000;
const sod=d=>{const x=new Date(d);x.setHours(0,0,0,0);return x};
const isoOf=d=>{const x=sod(d);return x.getFullYear()+'-'+String(x.getMonth()+1).padStart(2,'0')+'-'+String(x.getDate()).padStart(2,'0')};
const plusDays=n=>{const d=sod(new Date());d.setDate(d.getDate()+n);return isoOf(d)};
const parseISO=s=>{const [y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d)};
const diffDays=s=>Math.round((parseISO(s)-sod(new Date()))/DAY);
const fmtDate=s=>parseISO(s).toLocaleDateString('en-IN',{day:'numeric',month:'short',year:'numeric'});
function fmtTime(s){const [h,m]=s.split(':').map(Number);return ((h%12)||12)+':'+String(m).padStart(2,'0')+' '+(h<12?'AM':'PM')}

/* ================= risk engine (transparent rules) ================= */
const hav=(a,b,c,d)=>{const R=6371,r=x=>x*Math.PI/180,dl=r(c-a),dn=r(d-b);const x=Math.sin(dl/2)**2+Math.cos(r(a))*Math.cos(r(c))*Math.sin(dn/2)**2;return 2*R*Math.asin(Math.sqrt(x))};
const roadKm=(lat,lng)=>Math.max(.5,Math.round(hav(lat,lng,H.lat,H.lng)*1.3*10)/10);
const distKm=p=>roadKm(p.lat,p.lng);
function riskOf(f){
 if(f.status!=='pending')return{score:0,level:'low',reasons:[],actions:[]};
 const p=pt(f.pid),d=diffDays(f.due),R=[],A=[];let s=0;
 if(d<0){s+=Math.min(40,10+(-d)*3);R.push('Overdue by '+(-d)+' day(s)');A.push('Call the patient today and offer the earliest available slot')}
 else if(d<=2&&!f.confirmed){s+=10;R.push('Due within 2 days and not yet confirmed');A.push('Send a staff-approved reminder with clear instructions')}
 if(p.sharedPhone&&!p.altPhone){s+=15;R.push('Shared phone number – message may not reach the patient');A.push('Ask who answers this phone and record an alternate contact')}
 const km=distKm(p);
 if(km>40){s+=20;R.push('Lives about '+km+' km from the hospital');A.push('Share travel / ride options and try to bundle lab + consultation on one day')}
 else if(km>20){s+=10;R.push('Lives about '+km+' km from the hospital');A.push('Share travel options and expected leave-by time')}
 const bp={'Unclear instructions':[10,'Instructions unclear to the patient','Send simplified instructions in the patient’s language'],'Needs escort / wheelchair':[10,'Needs escort / wheelchair','Book a ward-boy escort and wheelchair at arrival'],'Cost of travel':[10,'Travel cost is a concern','Share low-cost ride options; check eligibility for hospital transport support'],'No one to accompany':[8,'No one to accompany the patient','Ask the community health worker / family to help'],'Language support needed':[6,'Needs language support','Assign a staff member who speaks the patient’s language'],'Long waiting time':[6,'Long waiting time reported','Offer a timed slot to cut waiting']};
 f.barriers.forEach(b=>{if(bp[b]){s+=bp[b][0];R.push(bp[b][1]);A.push(bp[b][2])}});
 if(p.missedBefore>=1){s+=15;R.push('Missed '+p.missedBefore+' earlier follow-up(s)')}
 const last=f.contacts.filter(c=>c.by!=='Patient (portal)').slice(-1)[0];
 if(last&&FAILED.includes(last.result)){s+=10;R.push('Last contact attempt failed ('+last.result+')');A.push('Retry at a different time, or reach the family / community health worker')}
 if(f.escalated){s+=10;R.push('Escalated by staff')}
 if(f.confirmed)s-=25;
 s=Math.max(0,Math.min(100,s));
 return{score:s,level:s>=60?'high':s>=30?'medium':'low',reasons:R,actions:[...new Set(A)]};
}
function statusOf(f){

 const d=diffDays(f.due);
 if(d<0)return{label:'Overdue',cls:'Overdue'};
 if(d===0)return{label:'Due today',cls:'Duetoday'};
 return f.confirmed?{label:'Confirmed',cls:'Confirmed'}:{label:'Upcoming',cls:'Upcoming'};

 if(kind==='barrier')return`<section class="auth-page"><div class="auth-card"><span class="auth-eyebrow">TELL US WHAT IS STOPPING YOU</span><h1>${t('barrier')}</h1><p class="auth-intro">This helps the hospital offer the right support. It is not a medical report.</p><form data-form="p-barrier" data-id="${f.id}">${BARRIERS.filter(b=>b!=='Needs escort / wheelchair').map(b=>`<label class="check"><input type="checkbox" name="b" value="${b}">${b}</label>`).join('')}<label class="field">Anything else (optional)<textarea name="note" rows="2"></textarea></label><button class="btn btn-primary btn-large" style="width:100%">Send to hospital team</button></form>${back}</div></section>`;
 if(kind==='assist')return`<section class="auth-page"><div class="auth-card"><span class="auth-eyebrow">HELP AT HOSPITAL</span><h1>${t('assist')}</h1><p class="auth-intro">Our ward staff will be ready when you arrive on ${fmtDate(f.due)}.</p><form data-form="p-assist" data-id="${f.id}"><label class="check"><input type="checkbox" name="a" value="wheel">Wheelchair + escort at arrival</label><label class="check"><input type="checkbox" name="a" value="lang">Someone who speaks my language</label><label class="check"><input type="checkbox" name="a" value="call">Please call me back</label><button class="btn btn-primary btn-large" style="width:100%">Request help</button></form>${back}</div></section>`;
 return notFound();
}

/* ---- Travel: GPS, traffic, rides, ambulance ---- */
function traffic(h){if((h>=8&&h<11)||(h>=17&&h<20))return{label:'Heavy',mult:1.6,cls:'high'};if((h>=7&&h<8)||(h>=11&&h<17)||(h>=20&&h<21))return{label:'Moderate',mult:1.25,cls:'medium'};return{label:'Light',mult:1,cls:'low'}}
const RIDES=[
 {k:'bike',name:'Rapido Bike taxi',icon:'🏍️',base:20,perKm:8,note:'1 person · quickest in traffic · not for patients who cannot sit upright'},
 {k:'auto',name:'Rapido Auto',icon:'🛺',base:30,perKm:13,note:'Up to 3 · patient + attendant'},
 {k:'cab',name:'Rapido Cab',icon:'🚕',base:60,perKm:16,note:'Up to 4 · comfortable for elderly patients'},
 {k:'amb',name:'Private ambulance (non-emergency transfer)',icon:'🚑',base:700,perKm:25,note:'Stretcher / wheelchair access · availability through partner operator, 24×7'}];
function pageTravel(f){
 const p=me(),o=GEO?{lat:GEO.lat,lng:GEO.lng,label:'Your live GPS location'+(GEO.acc?' (±'+GEO.acc+' m)':'')}:{lat:p.lat,lng:p.lng,label:'Saved address – '+p.area};
 const km=roadKm(o.lat,o.lng),now=traffic(new Date().getHours()),apt=traffic(parseInt(f.time)),eta=m=>Math.max(5,Math.round(km/30*60*m));
 const apMin=parseInt(f.time)*60+parseInt(f.time.split(':')[1]),leave=apMin-eta(apt.mult)-30;
 const fare=r=>{const e=(r.base+r.perKm*km)*(1+(now.mult-1)*.2)*(UI.round?2:1);return'₹'+Math.round(e*.9/5)*5+' – ₹'+Math.round(e*1.15/5)*5};
 const gm=`https://www.google.com/maps/dir/?api=1&origin=${o.lat},${o.lng}&destination=${H.lat},${H.lng}&travelmode=driving`;
 const emb=`https://maps.google.com/maps?saddr=${o.lat},${o.lng}&daddr=${H.lat},${H.lng}&output=embed`;
 return`<div class="page"><a class="btn btn-sm btn-outline" href="#/patient/followup/${f.id}">← ${t('back')}</a><h1 style="margin-top:16px">${t('plan_travel')}</h1><p class="lead">${esc(f.title)} · ${fmtDate(f.due)}, ${fmtTime(f.time)} · ${esc(H.name)}</p>
 <div class="stats"><div class="stat-card"><span>${t('distance')}</span><strong>${km} km</strong><small>approx. by road</small></div><div class="stat-card"><span>Travel time now</span><strong>${eta(now.mult)} min</strong><small>${now.label} traffic (estimate)</small></div><div class="stat-card"><span>Traffic at appointment time</span><strong><span class="risk ${apt.cls}">${apt.label}</span></strong><small>typical daily pattern</small></div><div class="stat-card"><span>Suggested leave-by</span><strong style="font-size:22px">${fmtMin(leave)}</strong><small>includes 30 min for registration</small></div></div>
 <div class="two"><div class="card"><h3>📍 Route from your location</h3><p style="margin-bottom:12px">Starting point: <b>${esc(o.label)}</b></p><div class="actions" style="margin-bottom:14px"><button class="btn btn-primary" data-act="gps">${UI.geoMsg||'Connect to my GPS'}</button><a class="btn btn-outline" target="_blank" rel="noopener" href="${gm}">Open live traffic in Google Maps ↗</a></div><iframe class="map" loading="lazy" referrerpolicy="no-referrer-when-downgrade" src="${emb}" title="Route to hospital"></iframe><p style="margin-top:10px;font-size:11.5px;color:#8a9a9e">Traffic level above is an estimate from time of day. Tap “Open live traffic” for real-time traffic and exact ETA from Google Maps.</p></div>
 <div class="card"><h3>🚑 Emergency</h3><p style="margin-bottom:12px">For an emergency, do not wait for a ride app. Call the free government ambulance.</p><div class="actions"><a class="btn btn-danger" href="tel:108">Call 108</a><a class="btn btn-outline" href="tel:112">Call 112</a></div><div class="warn-note">This portal gives travel help only — no medical advice.</div></div></div>
 <div class="card" style="margin-top:20px"><div class="case-head" style="padding:0 0 14px;border:0"><h3>Rides & ambulance — estimated cost to ${esc(H.name)}</h3><label class="check" style="margin:0"><input type="checkbox" data-change="round" ${UI.round?'checked':''}>Include return trip</label></div>
 ${RIDES.map(r=>`<div class="ride"><i>${r.icon}</i><div><b>${r.name}</b><small>${r.note}</small></div><div><span class="fare">${fare(r)}</span><small style="display:block">~${Math.round(eta(now.mult)*(r.k==='bike'?.8:1))} min · estimate</small></div><div class="actions"><a class="btn btn-sm btn-primary" target="_blank" rel="noopener" href="https://www.rapido.bike/">${r.k==='amb'?'Find ambulance':'Open Rapido'}</a><button class="btn btn-sm btn-outline" data-act="req-transport" data-id="${f.id}" data-ride="${r.name}">Ask hospital to arrange</button></div></div>`).join('')}
 <p style="margin-top:12px;font-size:11.5px;color:#8a9a9e">Fares are estimates (base + per-km, adjusted for traffic). The final fare is shown by the ride provider. Government ambulance 108 is free for emergencies.</p></div></div>`;
}

 <form data-form="s-login" data-role="${role}"><label class="field">${t('staff_id')}<input name="id" required autocomplete="username"></label><label class="field">${t('password')}<input type="password" name="pw" required autocomplete="current-password"></label><button class="btn btn-primary btn-large" style="width:100%">${t('login')}</button></form>

function routeAdmin(b,c){
 const u=staff();
 if(!u){if(b==='login'&&c&&ROLES[c])return pageStaffLogin(c);return pageRolePicker()}

const stat=(l,v,s)=>`<div class="stat-card"><span>${l}</span><strong>${v}</strong><small>${s||''}</small></div>`;
function dashTop(u){
 return`<div class="dash-top"><div><h1>${ROLES[u.role].icon} ${esc(u.name)}</h1><p>${ROLES[u.role].label} · ${esc(u.dept)} · ${esc(H.name)}</p></div><div class="actions"><span class="demo-tag">DEMO DATA</span>${['doctor','clinician'].includes(u.role)?'<a class="btn btn-primary" href="#/admin/new">+ New follow-up plan</a>':''}<button class="btn btn-outline" data-act="logout">${t('logout')}</button></div></div>`;
}
function caseTable(rows,title){
 if(!rows.length)return'<div class="case-card"><div class="empty-state">No follow-ups to show.</div></div>';
 return`<div class="case-card"><div class="case-head"><h3>${title||'Follow-up cases'}</h3><div class="filters"><input data-filter="q" placeholder="Search patient, department…"><select data-filter="r"><option value="">All risk</option><option value="high">High</option><option value="medium">Medium</option><option value="low">Low</option></select><select data-filter="s"><option value="">All status</option>${['Overdue','Due today','Upcoming','Confirmed','Reschedule requested','Completed','Closed'].map(s=>`<option>${s}</option>`).join('')}</select></div></div>
 <div class="table-wrap"><table id="cases"><thead><tr><th>Patient</th><th>Follow-up</th><th>Due</th><th>Distance</th><th>Risk (administrative)</th><th>Status</th><th>Last contact</th><th></th></tr></thead><tbody>
 ${rows.map(({f,p,r,st})=>{const lc=f.contacts.slice(-1)[0];return`<tr data-q="${esc((p.name+' '+f.title+' '+f.dept+' '+p.area).toLowerCase())}" data-r="${r.level}" data-s="${st.label}"><td><b>${esc(p.name)}</b><span class="sub">${p.age} yrs · ${esc(p.area)}</span></td><td>${esc(f.title)}<span class="sub">${esc(f.dept)} · ${esc(f.doctor)}</span></td><td>${fmtDate(f.due)}<span class="sub">${dueText(f)}</span></td><td>${distKm(p)} km</td><td>${f.status==='pending'?`<span class="risk ${r.level}">${r.level.toUpperCase()} · ${r.score}</span>`:'—'}</td><td><span class="status ${st.cls}">${st.label}</span></td><td>${lc?esc(lc.result)+`<span class="sub">${fmtDate(lc.date)}</span>`:'<span class="sub">No attempt yet</span>'}</td><td><a class="btn btn-sm btn-outline" href="#/admin/case/${f.id}">Open</a></td></tr>`}).join('')}</tbody></table></div></div>`;
}
function applyFilters(){
 const q=($('[data-filter=q]')||{}).value||'',r=($('[data-filter=r]')||{}).value||'',s=($('[data-filter=s]')||{}).value||'';
 document.querySelectorAll('#cases tbody tr').forEach(tr=>{tr.hidden=!((!q||tr.dataset.q.includes(q.toLowerCase()))&&(!r||tr.dataset.r===r)&&(!s||tr.dataset.s===s))});
}
function pageDash(u){
 const all=cases(),open=all.filter(c=>c.f.status==='pending');let inner='';
 const stats=(rows)=>{const o=rows.filter(c=>c.f.status==='pending');return`<div class="stats">${stat('Open follow-ups',o.length,'pending')}${stat('Overdue',o.filter(c=>c.d<0).length,'need action today')}${stat('High risk',o.filter(c=>c.r.level==='high').length,'administrative risk')}${stat('Awaiting plan approval',o.filter(c=>!c.f.planApproved).length,'staff review')}</div>`};
 if(u.role==='doctor'){const mine=all.filter(c=>c.f.doctor===u.name);inner=stats(mine)+caseTable(mine,'My patients’ follow-ups')}
 else if(u.role==='nurse'){const list=open.filter(c=>c.r.level!=='low'||c.d<=2||c.f.callback);inner=stats(all)+`<div class="warn-note" style="margin:0 0 18px">Priority call list — ${list.length} patient(s). Patient callback requests: ${open.filter(c=>c.f.callback).length}.</div>`+caseTable(list,'Priority call list')}
 else if(u.role==='clinician'){inner=stats(all)+caseTable(open.filter(c=>!c.f.planApproved).concat(open.filter(c=>c.f.planApproved)),'Follow-up desk – awaiting approval first')}
 else if(u.role==='ward')inner=wardView(all);
 else if(u.role==='pharmacist')inner=pharmView();
 else{
  const att=DB.followups.flatMap(f=>f.contacts).filter(c=>c.by!=='Patient (portal)'),ok=att.filter(c=>/^(Answered|SMS delivered|WhatsApp)/.test(c.result)).length;
  const done=DB.followups.filter(f=>f.status==='completed').length,bc={};open.forEach(c=>c.f.barriers.forEach(b=>bc[b]=(bc[b]||0)+1));const mx=Math.max(1,...Object.values(bc));
  inner=`<div class="stats">${stat('Open follow-ups',open.length,'pending')}${stat('Overdue',open.filter(c=>c.d<0).length,'need action')}${stat('High risk',open.filter(c=>c.r.level==='high').length,'administrative')}${stat('Contact success',att.length?Math.round(ok/att.length*100)+'%':'—',att.length+' attempts logged')}</div>
  <div class="grid g2" style="margin-bottom:22px"><div class="card"><h3>Barriers among open cases</h3>${Object.keys(bc).length?Object.entries(bc).sort((a,b)=>b[1]-a[1]).map(([k,v])=>`<div class="bar-row" style="grid-template-columns:170px 1fr 30px"><span>${k}</span><div class="bar"><i style="width:${v/mx*100}%"></i></div><b>${v}</b></div>`).join(''):'<p>No barriers recorded.</p>'}</div>
  <div class="card"><h3>Workload & outcomes</h3><div class="kv"><b>Completed visits</b><span>${done}</span><b>Open ward tasks</b><span>${DB.tasks.filter(t=>t.status==='open').length}</span><b>Medicines to dispense</b><span>${DB.rx.filter(r=>r.status==='pending').length}</span><b>Callback requests</b><span>${open.filter(c=>c.f.callback).length}</span></div><p style="margin-top:12px;font-size:11.5px">Risk flags are for administrative prioritisation, not clinical urgency.</p></div></div>`+caseTable(all)}
 return`<section class="dash">${dashTop(u)}${inner}<div class="warn-note">AI suggests; staff decide. Risk scores reflect follow-up completion risk — not clinical urgency.</div></section>`;
}
function wardView(all){
 const tasks=DB.tasks,arr=all.filter(c=>c.f.status==='pending'&&(c.d===0||(c.f.confirmed&&c.d<=1)));
 return`<div class="stats">${stat('Open tasks',tasks.filter(t=>t.status==='open').length,'assistance')}${stat('Completed today',tasks.filter(t=>t.status==='done').length,'')}${stat('Expected today',arr.length,'patients')}${stat('Wheelchair requests',tasks.filter(t=>t.status==='open'&&/Wheelchair/.test(t.type)).length,'')}</div>
 <div class="case-card"><div class="case-head"><h3>Assistance tasks</h3></div><div class="table-wrap"><table><thead><tr><th>Patient</th><th>Task</th><th>From → To</th><th>When</th><th>Source</th><th>Status</th><th></th></tr></thead><tbody>${tasks.map(k=>{const p=pt(k.pid);return`<tr><td><b>${esc(p.name)}</b><span class="sub">${p.age} yrs · speaks ${{en:'English',hi:'Hindi',pa:'Punjabi'}[p.lang]}</span></td><td>${esc(k.type)}</td><td>${esc(k.from)} → ${esc(k.to)}</td><td>${esc(k.when)}</td><td>${esc(k.source)}</td><td><span class="status ${k.status==='done'?'Completed':''}">${k.status==='done'?'Done':'Open'}</span></td><td>${k.status==='open'?`<button class="btn btn-sm btn-primary" data-act="task-done" data-id="${k.id}">Mark done</button>`:''}</td></tr>`}).join('')}</tbody></table></div></div>`;

 return`<div class="stats">${stat('To prepare',R.filter(r=>r.status==='pending').length,'for upcoming visits')}${stat('Dispensed',R.filter(r=>r.status==='dispensed').length,'')}${stat('Due within 3 days',R.filter(r=>r.status==='pending'&&diffDays(fu(r.fid).due)<=3).length,'prepare first')}${stat('Overdue visits',R.filter(r=>r.status==='pending'&&diffDays(fu(r.fid).due)<0).length,'patient may still collect')}</div>
 <div class="case-card"><div class="case-head"><h3>Medicines for follow-up visits (as prescribed by doctor)</h3></div><div class="table-wrap"><table><thead><tr><th>Patient</th><th>Visit</th><th>Items</th><th>Status</th><th></th></tr></thead><tbody>${R.map(r=>{const p=pt(r.pid),f=fu(r.fid);return`<tr><td><b>${esc(p.name)}</b><span class="sub">${esc(f.dept)}</span></td><td>${fmtDate(f.due)}<span class="sub">${dueText(f)}</span></td><td>${r.items.map(esc).join('<br>')}</td><td><span class="status ${r.status==='dispensed'?'Completed':''}">${r.status==='dispensed'?'Dispensed':'To prepare'}</span></td><td>${r.status==='pending'?`<button class="btn btn-sm btn-primary" data-act="rx-done" data-id="${r.id}">Mark dispensed</button>`:''}</td></tr>`}).join('')}</tbody></table></div></div>`;
}

 if(['ward','pharmacist'].includes(u.role))return deny();
 const f=fu(id);if(!f)return notFound();

 return`<section class="dash"><a class="btn btn-sm btn-outline" href="#/admin">← Dashboard</a>
 <div class="dash-top" style="margin-top:16px"><div><h1>${esc(p.name)} — ${esc(f.title)}</h1><p>${esc(f.dept)} · ${esc(f.doctor)} · Due ${fmtDate(f.due)}, ${fmtTime(f.time)}</p></div><div class="actions"><span class="status ${st.cls}">${st.label}</span>${open?`<span class="risk ${r.level}">${r.level.toUpperCase()} · ${r.score}</span>`:''}</div></div>

  ${f.reschedReq?`<div class="card" style="margin-bottom:20px"><h3>Reschedule request</h3><p>Patient asked for <b>${fmtDate(f.reschedReq.date)}</b> — ${esc(f.reschedReq.reason)}</p>${canAct?`<div class="actions" style="margin-top:12px"><button class="btn btn-primary btn-sm" data-act="resched-ok" data-id="${f.id}">Approve new date</button><button class="btn btn-outline btn-sm" data-act="resched-no" data-id="${f.id}">Decline</button></div>`:''}</div>`:''}
  <div class="card"><h3>Contact log</h3><div class="log" style="margin-top:14px">${f.contacts.length?f.contacts.map(c=>`<div><b>${esc(c.mode)} – ${esc(c.result)}</b>${c.note?'<br>'+esc(c.note):''}<small>${fmtDate(c.date)} · ${esc(c.by)}</small></div>`).join(''):'<div>No contact attempts yet.</div>'}</div>
  ${open&&canAct?`<form data-form="c-contact" data-id="${f.id}"><div class="grid g2"><label class="field">Mode<select name="mode"><option>Call</option><option>SMS</option><option>WhatsApp</option><option>Home / ASHA visit</option></select></label><label class="field">Result<select name="result">${CONTACT_RESULTS.map(x=>`<option>${x}</option>`).join('')}</select></label></div><label class="field">Note<input name="note" placeholder="Optional"></label><button class="btn btn-primary btn-sm">Add to log</button></form>`:''}</div>
 </div><div>
  <div class="card" style="margin-bottom:20px"><h3>Why this was flagged</h3>${open?(r.reasons.length?r.reasons.map(x=>`<div class="reason">${esc(x)}</div>`).join(''):'<p>No risk factors found.</p>'):'<p>Follow-up closed.</p>'}<p style="margin-top:8px;font-size:11px">Transparent rules · administrative risk, not clinical urgency.</p></div>

  ${open&&canAct?`<div class="card"><h3>Record verified outcome</h3><form data-form="c-outcome" data-id="${f.id}" style="margin-top:12px"><label class="field"><select name="o"><option value="attended">Attended at this hospital</option><option value="elsewhere">Received care elsewhere (verified)</option><option value="cancelled">Cancelled by doctor</option><option value="escalate">Not reachable – escalate</option></select></label><button class="btn btn-dark btn-sm">Save outcome</button></form></div>`:''}

}
function pageNewPlan(u){
 return`<section class="auth-page"><div class="auth-card" style="max-width:560px"><span class="auth-eyebrow">CARE PLAN</span><h1>New follow-up plan</h1><p class="auth-intro">Converts the clinician’s instruction into a tracked task with documents and medicines.</p>
 <form data-form="c-new"><label class="field">Patient<select name="pid">${DB.patients.map(p=>`<option value="${p.id}">${esc(p.name)} – ${esc(p.area)}</option>`).join('')}</select></label><label class="field">Follow-up title<input name="title" required placeholder="e.g. BP review"></label><div class="grid g2"><label class="field">Department<input name="dept" required value="${esc(u.role==='doctor'?u.dept:'')}"></label><label class="field">Doctor<input name="doctor" required value="${esc(u.role==='doctor'?u.name:'')}"></label></div><div class="grid g2"><label class="field">Due date<input type="date" name="due" min="${plusDays(0)}" required></label><label class="field">Time<input type="time" name="time" value="10:00" required></label></div><label class="field">Instructions (plain language)<textarea name="ins" rows="3" required></textarea></label><label class="field">Documents to bring (comma separated)<input name="docs"></label><label class="field">Medicines for pharmacy (one per line, optional)<textarea name="meds" rows="2"></textarea></label><button class="btn btn-primary btn-large" style="width:100%">Create plan</button></form><p class="auth-intro" style="margin:16px 0 0"><a class="btn btn-sm btn-outline" href="#/admin">${t('back')}</a></p></div></section>`;
}

/* ================= router + render ================= */
function render(){
 clearInterval(slideTimer);
 const parts=(location.hash||'#/').replace(/^#/,'').split('/').filter(Boolean),[a,b,c,d]=parts;let body;
 if(!a)body=pageHome();else if(a==='problem')body=pageProblem();else if(a==='how')body=pageHow();else if(a==='roles')body=pageRoles();else if(a==='roadmap')body=pageRoadmap();
 else if(a==='patient')body=routePatient(b,c,d);else if(a==='admin')body=routeAdmin(b,c,d);else body=notFound();
 $('#app').innerHTML=announce()+header()+'<main>'+body+'</main>'+footer();
 if(!a)startSlides();
 renderChat();
}
window.addEventListener('hashchange',()=>{UI.menu=false;render();window.scrollTo(0,0)});

/* ================= chat assistant (rules, no medical advice) ================= */
function renderChat(){
 const r=$('#chat-root');
 if(!UI.chat){r.innerHTML='<button class="chat-launcher" data-act="chat">💬 Help</button>';return}
 r.innerHTML=`<div class="chat-panel"><div class="chat-head"><div><strong>AARAMBH Assistant</strong><small>Admin & travel help · no medical advice</small></div><button class="modal-close" data-act="chat" aria-label="Close">×</button></div><div class="chat-body" id="chat-body">${UI.msgs.map(m=>`<div class="chat-bubble ${m.u?'chat-user':''}">${esc(m.t)}</div>`).join('')}</div><form class="chat-compose" data-form="chat"><input name="q" placeholder="Ask about login, travel, follow-ups…" autocomplete="off"><button class="btn btn-primary">Send</button></form></div>`;
 const b=$('#chat-body');b.scrollTop=b.scrollHeight;
}
function botReply(q){
 q=q.toLowerCase();
 if(/ambulance|emergency|chest|bleed|accident/.test(q))return'If this is an emergency, call 108 (ambulance) or 112 right now. I cannot give medical advice.';
 if(/rapido|ride|cab|auto|bike|fare|cost/.test(q))return'Open your follow-up → “Plan my travel”. You will see GPS distance, estimated fares for bike, auto, cab and non-emergency ambulance, and a button to open Rapido.';
 if(/otp|login|password/.test(q))return'Patients: use the registered mobile number and the demo OTP '+OTP_DEMO+'. Staff: choose your role in Hospital Administration and use the demo credentials shown on the login page.';
 if(/gps|location|traffic|distance/.test(q))return'On the travel page tap “Connect to my GPS”. Allow location access in your browser. Use “Open live traffic” for real-time traffic.';
 if(/resched|date|change/.test(q))return'Open the follow-up and choose “Ask to reschedule”. Hospital staff will confirm the new date.';
 if(/wheelchair|escort|help/.test(q))return'Open the follow-up and choose “Ask for help at hospital” to request a wheelchair, escort, language help or a callback.';
 return'I can help with login, follow-up dates, travel and ride options, and requesting help at the hospital. For medical questions please contact your doctor.';
}

/* ================= events ================= */
const handlers={
 menu(){UI.menu=!UI.menu;render()},
 slide(el){UI.slide=+el.dataset.i;paintSlide()},
 chat(){UI.chat=!UI.chat;renderChat()},
 'otp-back'(){UI.otp=false;render()},
 logout(){SESSION=null;store.del(SES_KEY);go('#/')},
 reset(){if(!confirm('Reset all demo data?'))return;store.del(LS);DB=seed();SESSION=null;store.del(SES_KEY);toast('Demo data reset');go('#/')},
 'p-confirm'(el){const f=fu(el.dataset.id);f.confirmed=true;addContact(f,{by:'Patient (portal)',mode:'Portal',result:'Patient confirmed the visit'});save();toast('Thank you! Your visit is confirmed.');render()},
 gps(){
  if(!navigator.geolocation){toast('GPS is not supported on this device');return}
  UI.geoMsg='Locating…';render();
  navigator.geolocation.getCurrentPosition(pos=>{GEO={lat:pos.coords.latitude,lng:pos.coords.longitude,acc:Math.round(pos.coords.accuracy)};UI.geoMsg='Update my location';render();toast('Location connected')},
  err=>{UI.geoMsg='';toast('Could not get location ('+(err.code===1?'permission denied':'unavailable')+'). Using saved address.');render()},{enableHighAccuracy:true,timeout:12000,maximumAge:60000});
 },
 'req-transport'(el){const f=fu(el.dataset.id),p=pt(f.pid);addContact(f,{by:'Patient (portal)',mode:'Portal',result:'Requested transport help',note:el.dataset.ride+' to hospital on '+fmtDate(f.due)});f.callback=true;if(!f.barriers.includes('Long distance')&&distKm(p)>20)f.barriers.push('Long distance');save();toast('Request sent. Hospital staff will call you.');},
 'approve-plan'(el){const f=fu(el.dataset.id);f.planApproved=true;f.planApprovedBy=staff().name;addContact(f,{by:staff().name,mode:'Review',result:'Navigation plan approved'});save();toast('Plan approved');render()},
 'resched-ok'(el){const f=fu(el.dataset.id);addContact(f,{by:staff().name,mode:'Review',result:'Reschedule approved to '+fmtDate(f.reschedReq.date)});f.due=f.reschedReq.date;f.reschedReq=null;f.confirmed=false;save();toast('New date set');render()},
 'resched-no'(el){const f=fu(el.dataset.id);addContact(f,{by:staff().name,mode:'Review',result:'Reschedule declined – call patient'});f.reschedReq=null;save();toast('Request declined');render()},
 'task-done'(el){DB.tasks.find(x=>x.id===el.dataset.id).status='done';save();toast('Task marked done');render()},
 'rx-done'(el){DB.rx.find(x=>x.id===el.dataset.id).status='dispensed';save();toast('Medicines marked dispensed');render()}
};
const forms={
 'p-otp'(fm){const ph=new FormData(fm).get('phone').trim(),p=DB.patients.find(x=>x.phone===ph);if(!p){toast('This number is not registered. Please contact OPD registration.');return}UI.phone=ph;UI.otp=true;render()},
 'p-verify'(fm){if(new FormData(fm).get('otp').trim()!==OTP_DEMO){toast('Incorrect OTP');return}const p=DB.patients.find(x=>x.phone===UI.phone);SESSION={type:'patient',id:p.id};store.set(SES_KEY,SESSION);UI.otp=false;LANG=p.lang;store.set(LANG_KEY,LANG);go('#/patient')},
 'p-profile'(fm){const fd=new FormData(fm),p=me();p.altPhone=fd.get('alt').trim();p.lang=fd.get('lang');LANG=p.lang;store.set(LANG_KEY,LANG);save();toast('Details saved');go('#/patient')},
 'p-resched'(fm){const f=fu(fm.dataset.id),fd=new FormData(fm);f.reschedReq={date:fd.get('date'),reason:fd.get('reason')};addContact(f,{by:'Patient (portal)',mode:'Portal',result:'Reschedule requested to '+fmtDate(fd.get('date')),note:fd.get('reason')});save();toast('Request sent to the hospital');go('#/patient/followup/'+f.id)},
 'p-barrier'(fm){const f=fu(fm.dataset.id),fd=new FormData(fm),v=fd.getAll('b');if(!v.length&&!fd.get('note')){toast('Please select at least one option');return}f.barriers=[...new Set(f.barriers.concat(v))];addContact(f,{by:'Patient (portal)',mode:'Portal',result:'Barrier reported: '+(v.join(', ')||'other'),note:fd.get('note')});save();toast('Thank you. The hospital team will help.');go('#/patient/followup/'+f.id)},
 'p-assist'(fm){const f=fu(fm.dataset.id),fd=new FormData(fm),v=fd.getAll('a');if(!v.length){toast('Please select at least one option');return}
  if(v.includes('wheel')){DB.tasks.push({id:uid('T'),pid:f.pid,fid:f.id,type:'Wheelchair + escort',from:'OPD Registration',to:f.dept,when:'On arrival, '+fmtDate(f.due),status:'open',source:'Patient request'});if(!f.barriers.includes('Needs escort / wheelchair'))f.barriers.push('Needs escort / wheelchair')}
  if(v.includes('lang')&&!f.barriers.includes('Language support needed'))f.barriers.push('Language support needed');
  if(v.includes('call'))f.callback=true;
  addContact(f,{by:'Patient (portal)',mode:'Portal',result:'Help requested',note:v.join(', ')});save();toast('Request sent. Staff will be ready for you.');go('#/patient/followup/'+f.id)},
 's-login'(fm){const fd=new FormData(fm),u=STAFF.find(s=>s.id===fd.get('id').trim().toUpperCase()&&s.pw===fd.get('pw')&&s.role===fm.dataset.role);if(!u){toast('Incorrect ID or password for this role');return}SESSION={type:'staff',id:u.id};store.set(SES_KEY,SESSION);go('#/admin')},
 'c-contact'(fm){const f=fu(fm.dataset.id),fd=new FormData(fm);addContact(f,{by:staff().name,mode:fd.get('mode'),result:fd.get('result'),note:fd.get('note')});if(fd.get('result')==='Answered – will come')f.confirmed=true;if(fd.get('result')==='Answered – needs help')f.callback=false;save();toast('Contact attempt logged');render()},
 'c-note'(fm){fu(fm.dataset.id).note=new FormData(fm).get('note');save();toast('Note saved')},
 'c-outcome'(fm){const f=fu(fm.dataset.id),o=new FormData(fm).get('o'),by=staff().name;
  if(o==='attended'||o==='elsewhere'){f.status='completed';f.outcome=o==='attended'?'Attended at this hospital':'Received care elsewhere (verified)';f.completedOn=plusDays(0)}
  else if(o==='cancelled'){f.status='closed';f.outcome='Cancelled by doctor'}
  else{f.escalated=true;addContact(f,{by:by,mode:'Review',result:'Escalated to follow-up desk'})}
  if(o!=='escalate')addContact(f,{by:by,mode:'Review',result:'Outcome recorded: '+f.outcome});save();toast('Outcome saved');go('#/admin')},
 'c-new'(fm){const fd=new FormData(fm),id=uid('F');
  DB.followups.push({id,pid:fd.get('pid'),title:fd.get('title'),dept:fd.get('dept'),doctor:fd.get('doctor'),due:fd.get('due'),time:fd.get('time'),instructions:fd.get('ins'),docs:fd.get('docs').split(',').map(s=>s.trim()).filter(Boolean),docsReady:[],barriers:[],contacts:[],status:'pending',confirmed:false,planApproved:false,reschedReq:null,callback:false,note:''});
  const meds=fd.get('meds').split('\n').map(s=>s.trim()).filter(Boolean);if(meds.length)DB.rx.push({id:uid('R'),fid:id,pid:fd.get('pid'),items:meds,status:'pending'});
  save();toast('Follow-up plan created');go('#/admin/case/'+id)},
 chat(fm){const q=new FormData(fm).get('q').trim();if(!q)return;UI.msgs.push({u:1,t:q},{t:botReply(q)});renderChat()}
};
document.addEventListener('click',e=>{const el=e.target.closest('[data-act]');if(el&&handlers[el.dataset.act]){e.preventDefault();handlers[el.dataset.act](el)}});
document.addEventListener('submit',e=>{const fm=e.target.closest('form[data-form]');if(fm&&forms[fm.dataset.form]){e.preventDefault();forms[fm.dataset.form](fm)}});
document.addEventListener('input',e=>{if(e.target.dataset&&e.target.dataset.filter)applyFilters()});
document.addEventListener('change',e=>{
 const el=e.target,c=el.dataset&&el.dataset.change;if(!c)return;
 if(c==='lang'){LANG=el.value;store.set(LANG_KEY,LANG);document.documentElement.lang=LANG;render()}
 else if(c==='doc'){const f=fu(el.dataset.id),i=+el.dataset.i;f.docsReady=el.checked?[...new Set(f.docsReady.concat(i))]:f.docsReady.filter(x=>x!==i);save()}
 else if(c==='round'){UI.round=el.checked;render()}
});
document.documentElement.lang=LANG;
render();
</script>
</body>
</html>
